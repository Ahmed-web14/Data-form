<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Checkout Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout Form</h2>
    <!-- Replace the URL below with your Google Apps Script Web App URL -->
    <form action="https://script.google.com/macros/s/AKfycbyHMmENZxQhNQ_G7I8TesLHztTPwM1mib2trzUN043Uln9e23E3s_snehB_l7Wee1O_Yw/exec" method="post">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com">

      <label for="address1">Address Line 1</label>
      <input type="text" id="address1" name="address1" placeholder="House No, Street, Area" required>

      <label for="address2">Address Line 2</label>
      <input type="text" id="address2" name="address2" placeholder="Apartment, Suite, etc.">

      <label for="city">City</label>
      <input type="text" id="city" name="city" placeholder="Enter your city" required>

      <label for="state">State / Province</label>
      <input type="text" id="state" name="state" placeholder="Enter your state" required>

      <label for="postal">Postal / ZIP Code</label>
      <input type="text" id="postal" name="postal" placeholder="e.g. 44000" required>

      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Select your country</option>
        <option value="Pakistan">Pakistan</option>
        <option value="India">India</option>
        <option value="United States">United States</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="Canada">Canada</option>
      </select>

      <label for="notes">Additional Notes (optional)</label>
      <textarea id="notes" name="notes" placeholder="Write any special instructions here"></textarea>

      <button type="submit">Place Order</button>
    </form>
  </div>
</body>
</html>
